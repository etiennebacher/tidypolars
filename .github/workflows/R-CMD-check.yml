# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions

on:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/R-CMD-check.yml
      - .Rbuildignore
      - R/**
      - tests/**
      - vignettes/*
      - DESCRIPTION
      - NAMESPACE
  pull_request:
    branches: [main, master]
    paths:
      - .github/workflows/R-CMD-check.yml
      - .Rbuildignore
      - R/**
      - tests/**
      - vignettes/*
      - DESCRIPTION
      - NAMESPACE

name: R-CMD-check

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: macOS-latest,   r: 'release'}
          - {os: macOS-latest,  r: 'oldrel-1'}
          - {os: macOS-latest,  r: 'oldrel-2'}
          - {os: macOS-latest,  r: 'oldrel-3'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # TODO: this shouldn't be necessary but it prevents occasional failures on
      # Windows, #291
      TESTTHAT_CPUS: ${{ matrix.os == 'windows-latest' && '1' || '2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: 'https://community.r-multiverse.org'

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck

      - uses: r-lib/actions/check-r-package@v2
